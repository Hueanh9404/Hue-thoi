<!DOCTYPE html>
<html lang="vi"
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhớ Nhớ Nhớ Em</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffdde1;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
            flex-direction: column;
        }
        .center-text {
            font-size: 2.5em;
            font-weight: bold;
            color: #ff4b5c;
            margin-bottom: 20px;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
        }
        .text {
            position: absolute;
            font-size: 2em;
            font-weight: bold;
            color: #ff4b5c;
            border: 2px solid #ff4b5c;
            padding: 10px;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            animation: floatUp 7s linear infinite;
            opacity: 0;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(100vh);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="center-text">Trong đầu Vịt anh bây giờ ^^...</div>
    <div class="container">
        <audio autoplay loop>
            <source src="./AlohaAloha-Cool_sd5f.mp3" type="audio/mp3">
        </audio>
        <script>
            function createFloatingText() {
                const container = document.querySelector('.container');
                for (let i = 0; i < 5; i++) { // Tăng số lượng chữ "Nhớ em" xuất hiện mỗi lần
                    const textElement = document.createElement('div');
                    textElement.classList.add('text');
                    textElement.style.left = Math.random() * 100 + 'vw';
                    textElement.style.animationDuration = (Math.random() * 5 + 6) + 's'; // Bay chậm hơn
                    textElement.innerText = "Nhớ Minh Huệ ❤️";
                    container.appendChild(textElement);
                    setTimeout(() => textElement.remove(), 7000);
                }
            }
            setInterval(createFloatingText, 500);
        </script>
    </div>
</body>
</html>
